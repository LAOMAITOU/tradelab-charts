const PERIODS = {"1m":60,"5m":300,"1h":3600,"4h":14400,"1D":86400};
const ENTRY = 1744856100, EXIT = 1744861500;
const chartEl = document.getElementById('chart');
const chart = LightweightCharts.createChart(chartEl, {
  width: chartEl.clientWidth, height: chartEl.clientHeight,
  layout: {background: {type:'solid', color:'#ffffff'}, textColor:'#222'},
  grid: {vertLines:{color:'#eee'}, horzLines:{color:'#eee'}},
  timeScale: {timeVisible:true, secondsVisible:false, borderColor:'#ccc'},
  rightPriceScale: {borderColor:'#ccc'},
  crosshair: {mode: 0},
});
const series = chart.addCandlestickSeries({
  upColor:'#ffffff', downColor:'#000000',
  borderUpColor:'#000000', borderDownColor:'#000000',
  wickUpColor:'#000000', wickDownColor:'#000000',
});
const emaLine = chart.addLineSeries({
  color:'#000000', lineWidth:1.5,
  priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false,
});
const emaHLine = chart.addLineSeries({
  color:'#888888', lineWidth:1, lineStyle:LightweightCharts.LineStyle.Dashed,
  priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false,
});
new ResizeObserver(()=>{
  chart.resize(chartEl.clientWidth, chartEl.clientHeight);
}).observe(chartEl);
function toBars(a){return a.map(r=>({time:r[0],open:r[1],high:r[2],low:r[3],close:r[4]}));}
function toMarks(a){return a.map(m=>({time:m[0],position:m[1],shape:m[2],color:'#000',text:m[3]}));}
function toLine(a){return a.map(p=>({time:p[0],value:p[1]}));}
function setFreq(f){
  series.setData(toBars(DATA[f].bars));
  series.setMarkers(toMarks(DATA[f].marks));
  emaLine.setData(toLine(DATA[f].e20));
  emaHLine.setData(toLine(DATA[f].e20h));
  const p = PERIODS[f];
  const from = Math.floor(ENTRY/p)*p - 20*p, to = Math.floor(EXIT/p)*p + 20*p;
  chart.timeScale().setVisibleRange({from:from, to:to});
  document.querySelectorAll('#btns button').forEach(b=>b.classList.toggle('on', b.dataset.f===f));
}
Object.keys(PERIODS).forEach(f=>{
  const b=document.createElement('button'); b.textContent=f; b.dataset.f=f;
  b.onclick=()=>setFreq(f); document.getElementById('btns').appendChild(b);
});
setFreq('1m');
